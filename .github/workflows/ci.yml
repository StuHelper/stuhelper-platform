name: CI
on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      combination:
        description: Integration source selection
        type: choice
        options:
          - latest
          - fixed
        default: latest
        required: true
      candidates:
        description: Optional paired candidates as a JSON object
        type: string
        default: "{}"
        required: false
      replay:
        description: Exact integration record copied from a previous summary
        type: string
        default: ""
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  framework:
    name: Framework checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up the declared pnpm version
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: false
      - name: Set up Go for pinned tools
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Install locked tools
        run: make setup
      - name: Run repository checks
        env:
          GOWORK: off
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: make check
      - name: Read paired integration candidates
        id: candidates
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec stuhelper-check integration-inputs
    outputs:
      candidates: ${{ steps.candidates.outputs.candidates }}
  integration:
    name: Cross-repository checks
    needs: framework
    uses: StuHelper/stuhelper-next/.github/workflows/integration.yml@tooling-v0.1.3
    with:
      source: ${{ inputs.combination || 'latest' }}
      candidate_repository: ${{ github.repository }}
      candidate_revision: ${{ github.sha }}
      candidates: ${{ inputs.candidates || needs.framework.outputs.candidates || '{}' }}
      replay: ${{ inputs.replay || '' }}
